project_name: "贝塔配置：风格行业轮动体系化方案"
replication_mode: "practical adaptation"
paper_source: "贝塔配置：风格行业轮动体系化方案.pdf"
sample_start: "2018-01-01"
sample_end: "2026-07-31"
benchmark: "000300.SH"
cost_bps_per_unit_turnover: 10.0

strategy:
  adapter: "strategy.adapter:run_strategy"
  # Audited public-data path used by the current real run. The original
  # stock-panel neutralization remains available as stock_panel_neutralized.
  mode: "public_index_proxy"
  signal:
    raw_factor: "style_proxy_composite"
    momentum_window: 126
    reversal_window: 20
    drawdown_window: 126
    beta_window: 60
    volatility_window: 20
    liquidity_window: 20
    winsorize_quantile: 0.01
    neutralize_industry: false
    min_cross_section: 4
    weights:
      momentum: 0.25
      reversal: 0.25
      volatility: 0.25
      drawdown: 0.25
  selection:
    top_n: 1
    weighting: "equal"
  backtest:
    rebalance_frequency: "monthly"
    commission_bps: 5.0
    slippage_bps: 5.0
    annualization_days: 252
    risk_free_rate: 0.025
    missing_held_return: "fail"

# A production run must point at a real, authorized input source.
# No synthetic, demo, random, or fallback provider is allowed.
data:
  provider: "local_files"
  profile: "public_index_proxy"
  path: "data/input"
  allow_network: false
  required_env: []
  required_files:
    - "prices.csv"
    - "benchmark.csv"
  prices_file: "prices.csv"
  benchmark_file: "benchmark.csv"

outputs:
  directory: "outputs"
  payload: "outputs/report.json"
  report: "outputs/report.html"
