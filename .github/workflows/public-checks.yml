name: Style-industry rotation public checks

on:
  push:
  pull_request:

concurrency:
  group: style-industry-public-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate public configuration structure
        run: python tools/validate_config.py --config config/base.yaml --structure-only

      - name: Compile production and preserved research source
        run: python -m compileall -q run_replication.py src tools tests scripts panda_factor/panda_factor/panda_factor panda_factor/panda_common/panda_common examples 大类.py

      - name: Run unit and isolated full-pipeline tests
        run: python -m pytest -q

      - name: Audit upload candidates
        run: |
          python tools/check_upload_manifest.py
          python tools/audit_repository.py
