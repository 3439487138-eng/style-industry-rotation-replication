name: Paper replication

on:
  workflow_dispatch:
    inputs:
      run_replication:
        description: Run the configured real strategy and publish current outputs
        required: true
        default: false
        type: boolean
      config_path:
        description: Repository-relative configuration path
        required: true
        default: config/base.yaml
        type: string

permissions:
  contents: write

concurrency:
  group: paper-replication-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate portable configuration
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: python tools/validate_config.py --config "$CONFIG_PATH" --structure-only

      - name: Run tests
        run: python -m pytest -q

      - name: Validate production readiness
        if: ${{ inputs.run_replication }}
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: python tools/validate_config.py --config "$CONFIG_PATH"

      - name: Run replication
        if: ${{ inputs.run_replication }}
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: python run_replication.py --config "$CONFIG_PATH"

      - name: Validate current report
        if: ${{ inputs.run_replication }}
        run: python tools/validate_report.py

      - name: Upload reproducibility outputs
        if: ${{ inputs.run_replication }}
        uses: actions/upload-artifact@v4
        with:
          name: paper-replication-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            outputs/report.json
            outputs/report.html

      - name: Commit current-run outputs to selected branch
        if: ${{ inputs.run_replication }}
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "chore: update replication outputs (run ${RUN_ID})"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
