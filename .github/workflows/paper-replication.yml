name: Style-industry rotation

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_full:
        description: Download authorized private data and execute the complete backtest
        required: true
        default: false
        type: boolean
      config_path:
        description: Repository-relative configuration path
        required: true
        default: config/base.yaml
        type: string

concurrency:
  group: style-industry-rotation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate public configuration structure
        run: python tools/validate_config.py --config config/base.yaml --structure-only

      - name: Compile production and preserved research source
        run: python -m compileall -q run_replication.py src tools tests scripts panda_factor/panda_factor/panda_factor panda_factor/panda_common/panda_common examples 大类.py

      - name: Run unit and isolated full-pipeline tests
        run: python -m pytest -q

      - name: Audit upload candidates
        run: |
          python tools/check_upload_manifest.py
          python tools/audit_repository.py

  full-backtest:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full }}
    needs: public-checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      REPLICATION_DATA_ARCHIVE_URL: ${{ secrets.REPLICATION_DATA_ARCHIVE_URL }}
      REPLICATION_DATA_ARCHIVE_TOKEN: ${{ secrets.REPLICATION_DATA_ARCHIVE_TOKEN }}
      REPLICATION_DATA_PATH: data/private
      CONFIG_PATH: ${{ inputs.config_path }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download authorized private input archive
        run: python tools/download_private_data.py --output data/private

      - name: Validate production readiness
        run: python tools/validate_config.py --config "$CONFIG_PATH"

      - name: Execute complete strategy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          python run_replication.py --config "$CONFIG_PATH" 2>&1 | tee logs/backtest.log

      - name: Validate current report
        run: python tools/validate_report.py

      - name: Upload outputs and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: style-industry-backtest-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            outputs/
            logs/

      - name: Commit successful current-run outputs
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "chore: update complete backtest outputs (run ${RUN_ID})"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
