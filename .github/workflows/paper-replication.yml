name: Style-industry rotation full backtest

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Repository-relative configuration path
        required: true
        default: config/base.yaml
        type: string

concurrency:
  group: style-industry-full-backtest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CONFIG_PATH: ${{ inputs.config_path }}
      SNAPSHOT_DIR: data/public_index_snapshot
      SNAPSHOT_MANIFEST: data/public_index_snapshot/manifest.json
      REPLICATION_DATA_PATH: data/input
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and test implementation
        run: |
          python -m compileall -q run_replication.py src tools tests
          python -m pytest -q

      - name: Verify fixed public snapshot and prepare production inputs
        run: |
          python tools/prepare_open_index_data.py \
            --source-dir "$SNAPSHOT_DIR" \
            --manifest "$SNAPSHOT_MANIFEST" \
            --output-dir "$REPLICATION_DATA_PATH"

      - name: Validate production readiness
        run: python tools/validate_config.py --config "$CONFIG_PATH"

      - name: Remove saved outputs before recomputation
        run: python tools/clean_generated_outputs.py --outputs outputs

      - name: Execute complete public-index strategy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          python run_replication.py --config "$CONFIG_PATH" 2>&1 | tee logs/backtest.log

      - name: Validate recomputed metrics, NAV and report
        run: |
          python tools/validate_backtest.py \
            --config "$CONFIG_PATH" \
            --data-path "$REPLICATION_DATA_PATH" \
            --outputs outputs
          python tools/validate_report.py
          test -s outputs/performance_metrics.csv
          test -s outputs/nav_curve.csv

      - name: Upload complete backtest artifact
        uses: actions/upload-artifact@v4
        with:
          name: style-industry-public-backtest-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            outputs/
            logs/

      - name: Commit and push current-run outputs
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "chore: update public-index backtest outputs (run ${RUN_ID})"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
